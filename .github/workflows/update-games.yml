name: LOWRES catalog sync
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Update authorized catalog feeds
        run: python scripts/update_games.py
      - name: Commit catalog changes
        run: |
          git config user.name "LOWRES Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "chore: sync authorized game catalog"
          git push
